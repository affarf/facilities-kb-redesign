<style>
  /* =========================================
     FACILITIES KB — SHARED RESOURCE GRID
     ========================================= */
  
  .kb-button-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin: 30px 0;
  }
  
  .kb-custom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
  
      min-width: 0;
      min-height: 150px;
      padding: 24px 16px;
  
      background: #c5050c;
      color: #ffffff !important;
      text-decoration: none !important;
  
      font-size: 16px;
      font-weight: bold;
      line-height: 1.35;
      text-align: center;
  
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      box-sizing: border-box;
  
      transition:
          background-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
  }
  
  .kb-custom-btn span {
      text-align: center;
  }
  
  .kb-btn-icon {
      width: 36px;
      height: 36px;
      fill: currentColor;
      flex-shrink: 0;
  }
  
  .kb-custom-btn:hover {
      background: #9b0000;
      color: #ffffff !important;
      transform: translateY(-3px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.16);
  }
  
  .kb-custom-btn:focus-visible {
      outline: 3px solid #0479a8;
      outline-offset: 3px;
  }
  
  /* Tablet */
  @media (max-width: 800px) {
      .kb-button-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
      }
  }
  
  /* Phone */
  @media (max-width: 550px) {
      .kb-button-grid {
          grid-template-columns: 1fr;
          gap: 14px;
      }
  
      .kb-custom-btn {
          min-height: 120px;
          padding: 20px 16px;
          font-size: 17px;
      }
  }
  
  /* =========================================
     INTERNAL DEMO — PUBLIC PROTOTYPE
     Only show publicly approved resources
     ========================================= */
  
  html.kb-public-prototype
  .kb-button-grid .kb-custom-btn:not(.kb-public-resource) {
      display: none !important;
  }
  
  
  /* AiM External: hide on the internal FP&M prototype */
  html:not(.kb-public-prototype)
  .kb-button-grid .kb-external-only {
    display: none !important;
  }
  
  
  
  /* External FP&M prototype: three resource cards */
  html.kb-public-prototype .kb-button-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    max-width: 1000px;
    margin: 30px auto;
  }
  
  /* Tablet: two columns */
  @media (max-width: 800px) {
    html.kb-public-prototype .kb-button-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  
  /* Phone: one column */
  @media (max-width: 550px) {
    html.kb-public-prototype .kb-button-grid {
        grid-template-columns: 1fr;
    }
  }
  
  
  /* Stack vertically on phones */
  @media (max-width: 550px) {
    html.kb-public-prototype .kb-button-grid {
        grid-template-columns: 1fr;
    }
  }
  
  /* Stack vertically on phones */
  @media (max-width: 550px) {
    html.kb-public-prototype .kb-button-grid {
        grid-template-columns: 1fr;
    }
  }
  
  @media (prefers-reduced-motion: reduce) {
      .kb-custom-btn {
          transition: none;
      }
  
      .kb-custom-btn:hover {
          transform: none;
      }
  }
</style>
